name: Deploy DBR after merge

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy main to GitHub Pages
    if: github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Record deployment result
    if: always() && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Write deployment status
        shell: bash
        run: |
          cat > DEPLOYMENT_STATUS.md <<EOF
          # DBR deployment status

          - Run: ${{ github.run_id }}
          - Trigger PR: #${{ github.event.pull_request.number }}
          - Main commit: $(git rev-parse HEAD)
          - Build: ${{ needs.build.result }}
          - Deploy: ${{ needs.deploy.result }}
          - Page URL: ${{ needs.deploy.outputs.page_url }}
          - Recorded UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
      - name: Commit deployment status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git commit -m "chore: record Pages deployment result" || exit 0
          git push origin HEAD:main
