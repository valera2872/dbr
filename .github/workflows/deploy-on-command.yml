name: Deploy DBR on command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages-command
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-dbr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy main to GitHub Pages
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-dbr'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Report deployment result
    if: >-
      always() &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-dbr'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const build = '${{ needs.build.result }}';
            const deploy = '${{ needs.deploy.result }}';
            const url = '${{ needs.deploy.outputs.page_url }}';
            const body = [
              '## DBR Pages deployment',
              '',
              `- Build: **${build}**`,
              `- Deploy: **${deploy}**`,
              `- Page URL: ${url || 'not available'}`,
              `- Run: ${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
