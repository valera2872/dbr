<circle cx="725" cy="400" r="390" fill="url(#lamp)"/><circle cx="1210" cy="575" r="520" fill="url(#flash)"/>
<!-- evidence scale card, foreground -->
<g transform="translate(1180 812) rotate(-3)" filter="url(#shadow)"><rect width="270" height="90" rx="5" fill="#d8d1bd"/><g fill="#1b1b18"><rect x="18" y="42" width="24" height="20"/><rect x="66" y="42" width="24" height="20"/><rect x="114" y="42" width="24" height="20"/><rect x="162" y="42" width="24" height="20"/><rect x="210" y="42" width="24" height="20"/></g><text x="18" y="29" font-family="monospace" font-size="17" fill="#24231f">DBR / 312 / SCALE</text></g>
<!-- vignette -->
<rect width="1600" height="1000" fill="none" stroke="#000" stroke-width="120" opacity=".34"/>
<text x="78" y="90" fill="#e4ddd2" font-family="monospace" font-size="23" letter-spacing="6" opacity=".82">ROOM 312 / SCENE PHOTOGRAPH / 07:46</text>
<text x="79" y="124" fill="#b09b78" font-family="monospace" font-size="16" letter-spacing="3" opacity=".68">COMMON WALL 312 ↔ 314 · ORIGINAL FRAME</text>
