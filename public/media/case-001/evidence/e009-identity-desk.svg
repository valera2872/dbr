<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Документальная сверка личности</title><desc id="d">Стол следователя с гостиничной регистрационной карточкой, архивным семейным снимком, копией паспорта, рукописными подписями и увеличительным стеклом.</desc>
<defs>
